# 129802 - Tomás Faria
name: Qodana Feature Envy 129802

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  feature-envy-129802:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Analisar Feature Envy
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: "--config qodana-129802.yaml"
          pr-mode: false
          upload-result: true
          use-caches: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}